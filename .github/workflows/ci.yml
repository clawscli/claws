name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Check generated files
        run: |
          go generate ./...
          git diff --exit-code || (echo "Generated files are out of date. Run 'task gen-imports' and commit." && exit 1)

      - name: Build
        run: go build ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          install-mode: goinstall
          version: v2.8.0
          args: --timeout=5m

      - name: Test
        run: go test ./...
  nix:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@6b2916c41eac5735ac995c58c9e8561a78c42319 # v31
      # Check that the flake is at least correct on all systems, does not run
      # any builds
      - name: Run nix flake check
        run: |
          nix flake check -vL --no-build --all-systems
      # Checks get run during the nix build
      - name: Nix build/test
        run: |
          nix build -vL .#clawscli --print-out-paths
